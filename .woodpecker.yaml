# Woodpecker CI — https://ci.codeberg.org
#
# v7.5 made the app cross-platform, so the pipeline can finally do more than
# prove it compiles: the unit tests run here too. They are pure logic (argument
# parsing, catalogue metadata, timecode maths, the SMB string layer) and need
# neither FFmpeg nor a quiet machine, which is exactly why they were split out
# of the e2e harnesses back in v7.4.1.
#
# Still Windows-only, and still not exercised here:
#   * the winmm.dll timeBeginPeriod call in Core/HighResolutionTimer.cs -- it is
#     guarded by OperatingSystem.IsWindows() and simply does nothing elsewhere;
#   * the UNC half of Remote/Smb.cs, which on Linux is joined by the CIFS mount
#     detection instead.
#
# The Python harnesses under tests/e2e/ remain excluded on purpose: they compare
# this build against the v6.3.3 baseline, need an FFmpeg carrying the legacy
# encoders, and pick frames against the wall clock, so a busy runner reports
# failures that have nothing to do with the change under review. Run them on a
# real machine; see docs/usage.md.

# v7.8.1 builds against net10.0 by default and publishes with RollForward=Major,
# so one output covers .NET 10 and .NET 11 machines. "Runs on both" is verified
# rather than assumed: the last two steps repeat build+test with
# -p:LaeTfm=net11.0, which is what would catch an API that only exists in one
# of the two.

when:
  - event: [push, pull_request]

steps:
  - name: restore
    image: mcr.microsoft.com/dotnet/sdk:11.0
    commands:
      - dotnet restore LiveArchiveEncoder.V7.slnx

  - name: build
    image: mcr.microsoft.com/dotnet/sdk:11.0
    commands:
      - dotnet build LiveArchiveEncoder.V7.slnx -c Release --no-restore

  - name: test
    image: mcr.microsoft.com/dotnet/sdk:11.0
    commands:
      - dotnet test LiveArchiveEncoder.V7.slnx -c Release --no-build

  - name: build (net11)
    image: mcr.microsoft.com/dotnet/sdk:11.0
    commands:
      - dotnet build LiveArchiveEncoder.V7.slnx -c Release -p:LaeTfm=net11.0

  - name: test (net11)
    image: mcr.microsoft.com/dotnet/sdk:11.0
    commands:
      - dotnet test LiveArchiveEncoder.V7.slnx -c Release -p:LaeTfm=net11.0 --no-build
