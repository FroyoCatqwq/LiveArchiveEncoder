name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# v7.5 made the app cross-platform, so both supported systems build and test
# every change. macOS is not in the matrix: nothing in the code depends on it,
# but nobody has run the legacy-encoder sweeps there.
jobs:
  unit-tests:
    name: build + unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Purely so the tests that probe a real FFmpeg run instead of skipping.
      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg xz-utils

      - name: Restore
        run: dotnet restore LiveArchiveEncoder.V7.slnx

      - name: Build
        run: dotnet build LiveArchiveEncoder.V7.slnx -c Release --no-restore

      - name: Test
        run: dotnet test LiveArchiveEncoder.V7.slnx -c Release --no-build

# The Python harnesses under tests/e2e/ are deliberately NOT run here: they
# compare this build against the v6.3.3 baseline and need an FFmpeg with the
# legacy encoders on PATH, plus a quiet machine (the realtime controller picks
# frames against the wall clock). Run them locally, see docs/usage.md.
