name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Both supported systems build and test every change. macOS is not in the
# matrix: nothing in the code depends on it, but nobody has run the
# legacy-encoder sweeps there.
jobs:
  unit-tests:
    name: build + unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # v7.9.8.13.2: Directory.Build.props promises the same sources build
      # against net11.0. Verify it rather than assuming it.
      - name: Set up .NET 11 (preview)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x
          dotnet-quality: preview

      # Purely so the tests that probe a real FFmpeg run instead of skipping.
      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg xz-utils

      - name: Verify solution manifest
        run: python tools/check-slnx.py

      - name: Restore
        run: dotnet restore LiveArchiveEncoder.V7.slnx

      - name: Build
        run: dotnet build LiveArchiveEncoder.V7.slnx -c Release --no-restore

      - name: Test
        run: dotnet test --solution LiveArchiveEncoder.V7.slnx -c Release --no-build

      - name: Build (net11.0)
        run: dotnet build LiveArchiveEncoder.V7.slnx -c Release -p:LaeTfm=net11.0

      - name: Test (net11.0)
        run: dotnet test --solution LiveArchiveEncoder.V7.slnx -c Release --no-build -p:LaeTfm=net11.0

# The pytest suite under tests/e2e/ is deliberately NOT run here: it
# compares this build against the v6.3.3 baseline and needs an FFmpeg with the
# legacy encoders on PATH, plus a quiet machine (the realtime controller picks
# frames against the wall clock). Run them locally, see docs/usage.md.
