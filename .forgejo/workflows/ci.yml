# Forgejo Actions — https://codeberg.org/fr0yo0v0_qwq/LiveArchiveEncoder
#
# Codeberg hosts Actions only in a limited fashion (docs.codeberg.org/ci/actions),
# so the pipeline that is guaranteed to run there is Woodpecker
# (.woodpecker.yaml). This workflow is here because Actions is the thing that can
# also attach build products to a release, and because `fj actions dispatch`
# lets you kick one off by hand.
#
# If no runner is registered for the repo the job simply stays queued. To give
# it one: Settings -> Units -> Actions, then Settings -> Actions -> Runners ->
# Create new Runner, and point a forgejo-runner at Codeberg with (at least) the
# label `ubuntu-latest`.
#
# Both flavours are published from the same Linux runner: .NET cross-publishes
# win-x64 fine as long as the build is framework-dependent (no RID-specific
# native assets to link), so one job gives you both archives.
#
# NativeAOT is deliberately NOT built here. On Windows it needs MSVC + the
# Windows SDK; on Linux it needs clang + zlib headers and is experimental
# (README, "Known constraints"). Build it locally with tools/build.ps1 -Aot
# or tools/build.sh --aot.

name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No actions/setup-dotnet and no apt-get here: this workflow runs on a
      # self-hosted host-mode runner, whose config already puts the mise-managed
      # .NET 11 SDK and an FFmpeg build on PATH. The setup action insists on
      # installing into /usr/share/dotnet, which an unprivileged runner cannot
      # create, and `sudo apt-get` would need a password nobody can type.
      #
      # The capabilities are printed rather than assumed: a failing CI job should
      # say which tool is missing.
      - name: Environment
        run: |
          dotnet --list-sdks
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - name: Restore
        run: dotnet restore LiveArchiveEncoder.V7.slnx

      - name: Build
        run: dotnet build LiveArchiveEncoder.V7.slnx -c Release --no-restore

      - name: Test
        # TUnit rides on Microsoft.Testing.Platform; global.json's test.runner
        # section routes `dotnet test` there, where the solution is named with
        # --solution instead of a positional path.
        run: dotnet test --solution LiveArchiveEncoder.V7.slnx -c Release --no-build

      # v7.8.1: the default build targets net10.0 and rolls forward to .NET 11,
      # so one archive covers both. Re-running the suite against net11.0 is what
      # proves that claim -- it is the only place an API that exists in just one
      # of the two would show up.
      - name: Build (net11)
        run: dotnet build LiveArchiveEncoder.V7.slnx -c Release -p:LaeTfm=net11.0

      - name: Test (net11)
        run: dotnet test --solution LiveArchiveEncoder.V7.slnx -c Release -p:LaeTfm=net11.0 --no-build

  package:
    name: publish ${{ matrix.rid }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [linux-x64, win-x64]
    steps:
      - uses: actions/checkout@v4

      # Same SDK story as above: the runner supplies it.
      - name: Environment
        run: dotnet --list-sdks

      - name: Publish
        run: |
          dotnet publish src/LiveArchiveEncoder/LiveArchiveEncoder.csproj \
            -c Release -r ${{ matrix.rid }} --self-contained false \
            -o publish/${{ matrix.rid }}

      # The Linux build is an extension-less apphost; make sure it carries the
      # executable bit before it goes into the archive.
      - name: Package (linux)
        if: matrix.rid == 'linux-x64'
        run: |
          chmod +x publish/linux-x64/LiveArchiveEncoder
          tar -czf dist-linux-x64.tar.gz -C publish/linux-x64 .

      - name: Package (windows)
        if: matrix.rid == 'win-x64'
        # `zip` is expected to be installed on the runner: apt-get here would
        # need a password nobody can type.
        run: |
          (cd publish/win-x64 && zip -q -r ../../dist-win-x64.zip .)

      # v4 of both artifact actions refuses to run anywhere but GitHub
      # ("not currently supported on GHES"); v3 uses the older protocol that
      # Forgejo implements.
      - name: Upload (linux)
        if: matrix.rid == 'linux-x64'
        uses: actions/upload-artifact@v3
        with:
          name: LiveArchiveEncoder-linux-x64
          path: dist-linux-x64.tar.gz

      - name: Upload (windows)
        if: matrix.rid == 'win-x64'
        uses: actions/upload-artifact@v3
        with:
          name: LiveArchiveEncoder-win-x64
          path: dist-win-x64.zip

# The Python harnesses under tests/e2e/ are deliberately not run here: they
# compare this build against the v6.3.3 baseline, need an FFmpeg carrying the
# legacy encoders, and pick frames against the wall clock, so a busy runner
# reports failures that have nothing to do with the change under review.
