# pytest configuration for the LiveArchiveEncoder end-to-end suite
# (tests/e2e/ -- see that directory's conftest.py and harness.py).
#
# Most of the suite only asks "did this option produce a structurally valid
# file", so those modules can share the machine. Three of them cannot:
#
#   timing        compare_matrix / ab_duration measure what the adaptive
#                 controller chose, which reacts to wall-clock jitter
#   shared_config cui_smoke reads and writes the real settings file, and every
#                 CLI run writes that same file on its way out
#
# `python tools/e2e.py` runs those two groups in two phases (alone first, then
# the rest in parallel). `pytest -n auto` over the whole suite is refused by a
# guard in conftest.py, because the timing assertions would go flaky instead of
# failing honestly.
[pytest]
testpaths = tests/e2e
# Default import mode (prepend) puts tests/e2e on sys.path, which is how the
# suite imports harness.py without any packaging.
addopts = -ra
norecursedirs = .* bin obj archive publish reference venv
markers =
    timing: measures wall-clock pacing; must run alone, never under xdist
    shared_config: touches the real settings file; must not run beside encodes
